root: "../../out"
schema_version: 1

dataset:
  name: "ets_unified"
  source_id: "terzo_settore_intelligence"
  tags: [terzo-settore, ets, anagrafe, capacita, territorio]
  category: terzo-settore
  description: "Fatti ETS (long) + profilo unificato (pivottato) + aggregato comunale. Legge i clean locali dei compose."
  years: [2026]
  time_coverage:
    mode: snapshot

raw:
  output_policy: overwrite
  sources:
    - name: "runts_clean"
      type: local_file
      args:
        path: "../../out/data/clean/runts/2026/runts_2026_clean.parquet"
      primary: true

support:
  - name: runts
    type: dataset
    config: "../../datasets/runts/dataset.yml"
    years: [2026]
  - name: ets_5xmille
    type: dataset
    config: "../ets_5xmille/dataset.yml"
    years: [2026]
  - name: ets_anac
    type: dataset
    config: "../ets_anac/dataset.yml"
    years: [2026]
  - name: ets_fts
    type: dataset
    config: "../ets_fts/dataset.yml"
    years: [2026]
  - name: ets_mef
    type: dataset
    config: "../ets_mef/dataset.yml"
    years: [2026]
  - name: ets_pnrr
    type: dataset
    config: "../ets_pnrr/dataset.yml"
    years: [2026]
  - name: ets_rna
    type: dataset
    config: "../ets_rna/dataset.yml"
    years: [2026]
  - name: ets_opencoesione
    type: dataset
    config: "../ets_opencoesione/dataset.yml"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - fonte
    - cf
    - anno
    - importo
  validate:
    not_null:
      - cf
      - fonte
    min_rows: 100000

mart:
  tables:
    - name: "ets_unified"
      sql: "sql/mart_ets.sql"
    - name: "ets_comuni"
      sql: "sql/mart_comuni.sql"
  required_tables:
    - ets_unified
    - ets_comuni
  validate:
    table_rules:
      ets_unified:
        required_columns:
          [
            codice_fiscale,
            denominazione,
            sezione,
            comune,
            provincia,
            capacita_progettuale,
          ]
        min_rows: 100000
      ets_comuni:
        required_columns: [comune, provincia, ets_tot, capacita_alta]
        primary_key: [comune, provincia]
        min_rows: 1000

validation:
  fail_on_error: true
