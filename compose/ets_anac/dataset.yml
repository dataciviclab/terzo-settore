root: "../../out"
schema_version: 1

dataset:
  name: "ets_anac"
  source_id: "terzo_settore_intelligence"
  tags: [terzo-settore, anac, appalti, compose]
  category: terzo-settore
  description: "Compose RUNTS + ANAC: aggiudicazioni, partecipazioni e subappalti."
  years: [2026]
  time_coverage:
    mode: snapshot

duckdb:
  memory_limit: "4GB"

raw:
  output_policy: overwrite
  sources:
    - name: "runts_clean"
      type: local_file
      args:
        path: "../../out/data/clean/runts/2026/runts_2026_clean.parquet"
      primary: true

support:
  - name: anac_bandi_gara
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/appalti_pubblici/anac_bandi_gara/{year}/anac_bandi_gara_{year}_clean.parquet"
    years: [2023, 2024, 2025]
  - name: anac_aggiudicatari
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/appalti_pubblici/anac_aggiudicatari/{year}/anac_aggiudicatari_{year}_clean.parquet"
    years: [2026]
  - name: anac_aggiudicazioni
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/appalti_pubblici/anac_aggiudicazioni/{year}/anac_aggiudicazioni_{year}_clean.parquet"
    years: [2026]
  - name: anac_partecipanti
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/appalti_pubblici/anac_partecipanti/{year}/anac_partecipanti_{year}_clean.parquet"
    years: [2026]
  - name: anac_subappalti
    type: external
    uri: "https://storage.googleapis.com/dataciviclab-clean/appalti_pubblici/anac_subappalti/{year}/anac_subappalti_{year}_clean.parquet"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - codice_fiscale
    - fonte
  validate:
    not_null: [codice_fiscale, fonte]
    min_rows: 50000

mart:
  tables:
    - name: "ets_anac_aggiudicazioni"
      sql: "sql/mart_aggiudicazioni.sql"
    - name: "ets_anac_partecipazioni"
      sql: "sql/mart_partecipazioni.sql"
    - name: "ets_anac_subappalti"
      sql: "sql/mart_subappalti.sql"
  required_tables:
    - ets_anac_aggiudicazioni
    - ets_anac_partecipazioni
    - ets_anac_subappalti
  validate:
    table_rules:
      ets_anac_aggiudicazioni:
        min_rows: 10000
      ets_anac_partecipazioni:
        min_rows: 10000

validation:
  fail_on_error: true
