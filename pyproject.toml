[project]
name = "terzo-settore-intelligence"
version = "0.2.0"
description = "OSINT Terzo Settore — catalogo bandi, matching ETS, contatti"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
enrich = ["googlemaps>=4.10"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/dataciviclab/terzo-settore-intelligence"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
include = ["tsi*"]
