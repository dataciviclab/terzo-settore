root: "../../out"
schema_version: 1

dataset:
  name: "ade_cinque_per_mille"
  source_id: "ade"
  tags: [terzo-settore, ade, cinque, per, mille]
  category: terzo-settore
  years: [2022, 2023, 2024, 2025]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python scripts/download_5x1000.py --year {year} --output raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    delim: ";"
    encoding: "utf-8"
    decimal: ","
    header: true
    skip: 0
    ignore_errors: true
  read_mode: strict
  sql: "sql/clean.sql"
  required_columns:
    - progressivo
    - codice_fiscale
    - denominazione
    - regione
    - importo_totale_erogabile
  validate:
    min_rows: 10000
    not_null:
      - progressivo
      - codice_fiscale
      - denominazione
      - anno

mart:
  tables:
    - name: "ade_cinque_per_mille"
      sql: "sql/mart.sql"
    - name: "five_per_mille_trend"
      sql: "sql/mart_trend.sql"
    - name: "five_per_mille_per_provincia"
      sql: "sql/mart_per_provincia.sql"
    - name: "five_per_mille_top_enti"
      sql: "sql/mart_top_enti.sql"
    - name: "five_per_mille_per_categoria"
      sql: "sql/mart_per_categoria.sql"
  required_tables:
    - "ade_cinque_per_mille"
    - "five_per_mille_trend"
    - "five_per_mille_per_provincia"
    - "five_per_mille_top_enti"
    - "five_per_mille_per_categoria"
  validate:
    table_rules:
      ade_cinque_per_mille:
        min_rows: 1
      five_per_mille_trend:
        min_rows: 1
        required_columns: [anno, enti_totali, importo_totale]
      five_per_mille_per_provincia:
        min_rows: 100
        required_columns: [anno, sigla_provincia, enti, importo_totale]
      five_per_mille_top_enti:
        min_rows: 50
        required_columns: [anno, codice_fiscale, importo, ranking]
      five_per_mille_per_categoria:
        min_rows: 7
        required_columns: [anno, categoria, enti, importo]
