root: "../../out"
schema_version: 1

dataset:
  name: "open_cooperazione"
  source_id: "open_cooperazione"
  tags: [terzo-settore, cooperazione, osc, ong, trasparenza]
  category: terzo-settore
  description: >-
    Open Cooperazione (Info-Cooperazione): dati autodichiarati di trasparenza
    delle OSC italiane attive in cooperazione allo sviluppo e aiuto umanitario.
    Snapshot multi-anno (2013-2025) + join codice fiscale da mapping schede.
  years: [2026]
  time_coverage:
    mode: snapshot

raw:
  output_policy: overwrite
  sources:
    - name: "open_cooperazione_csv"
      type: script
      args:
        command: "python scripts/fetch_open_cooperazione.py --output raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    encoding: "utf-8"
    delim: ";"
    header: true
  required_columns:
    - codice_fiscale
    - nome_organizzazione
    - url_scheda
    - anno_dati
    - anno_bilancio
    - forma_giuridica
    - is_ets
    - is_aics
    - bilancio_entrate
    - bilancio_uscite
    - is_bilancio_outlier
    - fondi_istituzionali
    - fondi_privati
    - fondi_5x1000
    - dipendenti_italia
    - dipendenti_estero
    - progetti_diretti
    - progetti_indiretti
    - beneficiari
    - volontari_totali
    - numero_donatori
    - compliance_231
    - organo_controllo_interno
    - codice_etico
    - provincia
    - citta
  validate:
    not_null:
      - nome_organizzazione
      - anno_dati
      - forma_giuridica
      - is_ets
      - is_aics
    min_rows: 1000

mart:
  tables:
    - name: "open_cooperazione"
      sql: "sql/mart.sql"
    - name: "open_cooperazione_profilo"
      sql: "sql/mart_profilo.sql"
  required_tables:
    - open_cooperazione
    - open_cooperazione_profilo
  validate:
    table_rules:
      open_cooperazione:
        min_rows: 1000
      open_cooperazione_profilo:
        min_rows: 100
        required_columns: [codice_fiscale, nome_organizzazione, anno_ultimi_dati]

validation:
  fail_on_error: true
